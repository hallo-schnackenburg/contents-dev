text:
  body: |
    ![Einheitsfeuer am Elbufer in Lütkenwisch 2026](https://schnackenburg.de/wp-content/uploads/2026/10/Einheitsfeier_001.jpg)

    #### Erinnerung an die Deutsche Wiedervereinigung

    Jedes Jahr zum 3. Oktober lädt die Stadt Schnackenburg und die Ortschaft Lütkenwisch abwechselnd zu einer besonderen Tradition ein: das Einheitsfeuer. Diese Veranstaltung erinnert an die Deutsche Wiedervereinigung und die Überwindung der Teilung unseres Landes.

    #### Frieden, Freiheit und Zusammenhalt

    Das Einheitsfeuer steht symbolisch für Frieden, Freiheit und Zusammenhalt und wurde von den Bürgermeistern aus Schnackenburg, Karl-Hans John, und aus Lanz, Hans Borchert, initiiert und von Beginn an durch die Freiwillige Feuerwehr unterstützt. Es ist ein Moment des Gedenkens, aber auch der Begegnung und des Austauschs. Mit einem Programm aus Redebeiträgen, Musik und kulinarischen Angeboten begehen die Einheimischen und die Gäste den Tag der Deutschen Einheit gemeinsam. Bereits seit 1990 wechselt der Veranstaltungsort jährlich zwischen Schnackenburg und Lütkenwisch, wobei Schnackenburg die “Traditionsfeier” in den ungeraden Jahren ausrichtet.

    ![Blick auf Schnackenburg 2026](https://schnackenburg.de/wp-content/uploads/2026/10/Einheitsfeier_002.jpg)

    ![Fähre Ilka auf dem Weg nach Lütkenwisch](https://schnackenburg.de/wp-content/uploads/Einheitsfeier_003_Priess.jpg)

    #### Symbol der Wiedervereinigung

    Die Fähre, die zwischen den beiden Orten verkehrt und ein Symbol für die Wiedervereinigung darstellt, macht diese besondere Begegnung möglich (derzeit außer Betrieb).

    Im Jahr 2027 findet das Einheitsfeuer wieder auf dem Marktplatz in Schnackenburg statt.
