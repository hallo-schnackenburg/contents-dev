    ## Stadt Schnackenburg

    ![Ein Portraitbild des Bürgermeister der Stadt Schnackenburg – Matthias Köhler. Ein grauhaariger Mann mit Brille und 3 Tage Bart im dunkel blauen Anzug und weißem Hemd, der mit offenen Augen in die Kamera schaut. Der Hintergrund ist unscharf verschwommen.](https://schnackenburg.de/wp-content/uploads/Buergermeister.jpg)

    ![](https://schnackenburg.de/wp-content/uploads/circles.png)

    ![](https://schnackenburg.de/wp-content/uploads/dots.png)

    ![](https://schnackenburg.de/wp-content/uploads/schnackenburg-favicon.png)

    Liebe Mitbürgerinnen und Mitbürger, liebe Besucher, es ist mir eine Freude, Sie auf unserer neuen Internetseite begrüßen zu dürfen. Dass sich aus der Mitte unseres kleinen Städtchens und seinen angegliederten Gemeinden so viele ehrenamtliche Ideengeber und „Macher“ zusammengefunden haben, erfüllt mich mit Stolz. Spricht es nicht auch dafür, dass es in unseren Gemeinden einen guten Zusammenhalt und Spaß am Zusammentragen und Weitergeben von Informationen durch engagierte Bürgerinnen und Bürger gibt?

    Begeistert bin ich von dem breiten Spektrum, das die Verantwortlichen des neu gegründeten Vereins „Hallo Schnackenburg – Verein für Medien und Kommunikation“ auf diesen Seiten publizieren. Angefangen von Nachrichten aus dem Vereinsleben unserer vielen örtlichen Vereine, über geschichtliche Hintergründe bis zu Tipps zu Touren zu Fuß oder per Fahrrad in unserer wunderschönen Umgebung.

    Geboren und aufgewachsen in Schnackenburg, bin ich meinem Heimatstädtchen sehr verbunden und erfülle meine Aufgabe als Bürgermeister mit viel Freude und Engagement. Jede Initiative, die Schnackenburg und die Gemeinden Holtorf, Kapern und Gummern voranbringen, finden bei mir offene Ohren und Unterstützung.

    Den Mitgliedern von „Hallo Schnackenburg“ wünsche ich viel Freude am Entwickeln, dass ihnen nie die Ideen ausgehen mögen und viel Unterstützung von allen Seiten – auf mich könnt ihr zählen.

    Ihnen, liebe Besucher, wünsche ich, dass Sie die Internetseite erfreut und reizt, Schnackenburg, seine netten Bürgerinnen und Bürger und die wunderschöne Umgebung kennenzulernen.

    Ich würde mich freuen, Sie bei uns begrüßen zu können.

    Matthias Köhler, Bürgermeister

    ![](https://schnackenburg.de/wp-content/uploads/stars.png)

    ## Was finde ich Wo?

    Haben sie ein Anliegen oder Fragen an den Bürgermeister?

    Unser Bürgerbüro befindet sich in der Elbstr. 9.

    Sie können unsere Bürozeiten am Freitag von 10:00 bis 12:00 Uhr nutzen, hierzu vereinbaren sie bitte vorab einen Termin:

    Tel. 0171 5075521 Matthias Köhler

    Sie können uns auch per Mail unter [stadtschnackenburg(at)gartow.de](mailto:stadtschnackenburg@gartow.de) erreichen.

