    ## Deutsch-deutsche Geschichte

    ![](https://schnackenburg.de/wp-content/uploads/PHOTO-2021-05-16-15-01-13.jpg)

    #### Erinnern hilft gegen vergessen

    Diesem Motto folgt das Grenzlandmuseum Schnackenburg und erinnert mit seiner Ausstellung an die 45 Jahre dauernde Teilung Deutschlands. Denn bis 1989 stieß man im Wendland in nord- und südöstlicher Richtung an die kaum überwindbare deutsch-deutsche Grenze. Die Stadt Schnackenburg, unmittelbar an der Elbe gelegen, war in besonderer Weise davon betroffen.

    Das Museum ist zugleich Informations- und Dokumentationszentrum, aber auch Mahn- und Erinnerungsstätte. Unsere Dauerausstellung dokumentiert neben Uniformen, Ausrüstungsgegenständen, Waffen und Fahrzeugen auch zahlreiche Dokumente und Fotografien sowie Zeitzeugenberichte von diesseits und jenseits der ehemaligen Grenze.

    #### Außenstelle Stresow - auch ein Besuch wert

    Bestandteil des Museums ist die Außenanlage Gedenk- und Begegnungsstätte Stresow (Sachsen-Anhalt), welche nur wenige Kilometer entfernt (3,5 km) besichtigt werden kann. Sie erinnert an die „Aktion Ungeziefer“, welches die Zwangsaussiedlungen an der innerdeutschen Grenze vorsah.

    ![Gedenkstätte Stresow](https://schnackenburg.de/wp-content/uploads/IMG_6683.jpg)

    ![](https://schnackenburg.de/wp-content/uploads/PHOTO-2021-05-16-14-38-46-2.jpg)

    #### „Das besondere Angebot“ und Förderverein

    Das Museum verfügt über eine kleine Fachbibliothek zur DDR-Geschichte sowie regionale Fahrradkarten und weitere Routenpläne.

    Der Förderverein Grenzland-Museum Schnackenburg e.V. gründete sich im Jahr 1994 auf einer Idee des ehemaligen Samtgemeindedirektors Hans Borchardt. Das Museum finanziert sich über Mitgliedsbeiträge des Fördervereins, Spenden und Eintrittsgelder.

    #### Kontakt

    Wenn Sie gern einmal in die Geschichte eintauchen oder Geschichten und Anekdoten rund um Schnackenburg hören möchten, dann besuchen Sie uns oder nehmen nach Voranmeldung an unserer [Stadtführung](https://schnackenburg.de/stadtfuehrungen/) teil.

    Statten sie dem Museum einen Besuch ab. Unsere ehrenamtlich tätigen Mitarbeiter beantworten auch gerne Ihre Fragen.

    Am Markt 4
    29493 Schnackenburg
    Tel. 05840-210

