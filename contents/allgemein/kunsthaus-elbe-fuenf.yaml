    ## Kunsträume in Schnackenburg

    ![](https://schnackenburg.de/wp-content/uploads/Elbe-5_000.jpg)

    Wir laden Sie herzlich ein in die kleinste Stadt Niedersachsens, in das 2017 gegründete Kunsthaus. Gründungsmitglieder waren fünf Künstler/innen aus Schnackenburg. Ziel der Gruppe ist es, in dieser wunderschönen Umgebung Kunsträume zu schaffen, Kunst zu leben, zu erleben und dadurch schöpferisch zu bereichern.

    Ein weiteres Anliegen ist es, ein Austauschtreff für Kunstschaffende aus verschiedenen Bereichen der Kunst anzubieten. Wir wünschen uns ein offenes und lebendiges Miteinander. Dies findet z. B. durch wechselnde Ausstellungen im Rahmen der Kulturellen Landpartie, in der Zusammenarbeit mit den Schubertiaden Schnackenburg und Einladungen zu besonderen Anlässen, ins Haus „elbe fünf“, statt.

    Während den Öffnungszeiten gibt es die Möglichkeit für Erfrischungen und anregenden Gesprächen im lauschigen Innenhof.

    #### Informationen zu Veranstaltungen

    Im Winter ist das Kunsthaus in der Regel geschlossen. Informationen über anstehende Events und die Öffnungszeiten können über die Telefonnummer 0176 70490121 und E-Mail [ann-lee2@outlook.de](mailto:ann-lee2@outlook.de) abgerufen werden.

    Außerdem werden wir Sie durch Hinweise auf unsere Veranstaltungen in der hiesigen Zeitung EJZ und durch Aushänge am Kunsthaus informieren.

    Wir freuen uns auf Ihren Besuch.

    Die elbe fünfler

