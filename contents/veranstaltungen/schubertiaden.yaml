    #### Kammermusik an der Elbe

    Die Schubertiaden Schnackenburg sind ein spendenbasiertes, über Jahre bescheiden gewachsenes, traditionsreiches Festival mit einem außergewöhnlichen Konzept: wie einst bei Franz Schubert und seinen „Schubertiaden“ steht die Freude und Begeisterung an der Musik und nicht die kommerzielle Vermarktung im Vordergrund.

    So lädt der Pianist und künstlerische Leiter Prof. Arkadi Zenzipér jedes Jahr im September international bekannte Musiker aus aller Welt zu sich nach Schnackenburg ein, um mit ihnen gemeinsam vier Konzertabende zu gestalten. Das Programm wird von den Musikerinnen und Musikern in der Probenphase kurz vor dem Festival selbst ausgewählt. Die Musikerinnen und Musiker spielen honorarlos und engagieren sich somit sozial für die Öffentlichkeit und Region. Außerdem vermitteln sie Auftritte an talentierte Nachwuchsmusiker, die den Eröffnungsabend der Schubertiaden gestalten.

    Von Anfang an fanden die Konzertreihen große Resonanz bei den Zuhörern und so wurden die Schubertiaden in der kleinsten Stadt Niedersachsens im Laufe der Jahre zu einer beliebten Begegnungsstätte zwischen Interpreten und Zuhörern, die Musikliebhaber aus allen Teilen Deutschlands zu schätzen wissen.

    ![Kammermusikensemble ©Mafalda Lee](https://schnackenburg.de/wp-content/uploads/Foerderverein-Schubertiaden_003_Lee.jpg)

    ![Atmosphäre ©Mafalda Lee](https://schnackenburg.de/wp-content/uploads/Schubertiaden_004_Lee.jpg)

    #### Freunde musizieren für Freunde

    Das Programm der Schubertiaden entsteht durch den Austausch und die Spontaneität der Musiker, sodass kein langfristig fixiertes Programm festgelegt ist, sondern Schwerpunkte des jeweiligen Konzertabends angekündigt werden. Die Musikerinnen und Musiker der Schubertiaden Schnackenburg spielen ohne Honorar, aus reiner Freude am gemeinsamen Musizieren und erarbeiten das Konzertprogramm kurz vor Festivalbeginn vor Ort. Ein singuläres Konzept, welches sich seit Jahren bewährt.

    #### Spielort

    Die wunderschöne St. Nicolai Kirche ist die Spielstätte der Schubertiaden Schnackenburg. Die Kirche ist St. Nicolaus, dem Schutzpatron der Schiffer und Kaufleute, geweiht und bietet etwa 250 BesucherInnen Platz. Die romanische Backsteinkirche, erbaut um 1200, besticht durch eine exzellente Akustik.

    Weitere Informationen: [https://www.schubertiaden-schnackenburg.de/](https://www.schubertiaden-schnackenburg.de/)

