    ## Adventskaffee im Gemeinschaftshaus Kapern

    ![Veranstalter: Gemeinschaftshaus Kapern](https://schnackenburg.de/wp-content/uploads/2026/05/Adventskaffee_01.jpg)

    #### Mit Filmvorführung

    **06\. Dezember um 15:00 Uhr**

    Gemeinschaftshaus Kapern, Dorfstraße 24, 29493 Schnackenburg

    **Wir laden Euch herzlich zum Adventskaffee ins Gemeinschaftshaus Kapern ein.**

    In gemütlicher vorweihnachtlicher Atmosphäre möchten wir gemeinsam Kaffee trinken, selbstgebackenen Kuchen und Torten genießen und miteinander ins Gespräch kommen.

    **Als besonderes Highlight erwartet euch die Präsentation und Filmvorführung zum „ELBE-TAG Schnackenburg“.**

    Die Vorführung widmet sich den Ereignissen des Jahres 1945 an der Elbe bei Schnackenburg. Bereits zum vierten Mal werden einzigartige historische Filmaufnahmen gezeigt, die die Begegnung amerikanischer und sowjetischer Soldaten bei Kriegsende dokumentieren. Als seltenes historisches Zeitzeugnis markieren die Ereignisse das Ende des Zweiten Weltkriegs. Gleichzeitig steht es für den Beginn der innerdeutschen Teilung.

    **Die Filmvorführung ist ein Projekt von „[Hallo Schnackenburg – Verein für Medien und Kommunikation e.V.](https://schnackenburg.de/hallo-schnackenburg/)“ in Kooperation mit dem „[Förderverein Grenzland-Museum Schnackenburg e.V.](http://www.grenzland-museum-schnackenburg.de/)„.**

    Die Veranstaltung findet auf Spendenbasis statt.

    ![Quelle: Stephan Prieß (mit freundlicher Genehmigung der National Archives and Records Administration, USA), 2026](https://schnackenburg.de/wp-content/uploads/2026/03/Elbe-Day_01.png)
