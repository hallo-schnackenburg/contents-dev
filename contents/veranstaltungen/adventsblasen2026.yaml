    ## Festliche Lieder in gemütlicher Atmosphäre

    ![](https://schnackenburg.de/wp-content/uploads/2026/05/Adventsblasen_01.png)

    **20\. Dezember ab 17:00 Uhr**

    Kirchplatz Schnackenburg, 29493 Schnackenburg

    Der Posaunenchor Schnackenburg lädt herzlich ein zu einem stimmungsvollen Abend auf dem Kirchplatz! Kommt vorbei und stimmt Euch gemeinsam musikalisch auf Weihnachten ein. Genießt festliche Lieder in gemütlicher Atmosphäre, wärmenden Glühwein, heißen Kakao und herzhafte Schmalzstullen.

    #### Eine festliche Tradition

    Jedes Jahr kurz vor Weihnachten erklingt in Schnackenburg feierliche Musik, wenn der Posaunenchor mit seinem traditionellen Adventsblasen die Weihnachtszeit einläutet. Seit über 20 Jahren begeistert diese musikalische Veranstaltung die Zuhörer und sorgt für eine besinnliche Atmosphäre.

    Das Repertoire umfasst eine Mischung aus kirchlichen und weltlichen Weihnachtsliedern. Klassiker wie „O Tannenbaum“ und „Macht hoch die Tür“ gehören ebenso dazu wie internationale Melodien, darunter „We wish you a very good Christmas“.

    ![Adventsblasen vor der St.-Nicolai-Kirche](https://schnackenburg.de/wp-content/uploads/Adventsblasen_001_Priess-1.jpg)

    #### Glühwein und Schmalzstullen

    Das Konzert findet traditionell am Abend statt. Die Musiker tragen rote Zipfelmützen und schaffen mit ihren Klängen eine festliche Stimmung. Begleitet wird das Adventsblasen traditionell von wärmendem Glühwein und Schmalzstullen, die von freiwilligen Helfern angeboten werden.

    Trotz kleiner Veränderungen bleibt das Adventsblasen in Schnackenburg eine feste Größe im vorweihnachtlichen Kalender und bringt die Dorfgemeinschaft in stimmungsvoller Weise zusammen.

    ![Schmalzstullen](https://schnackenburg.de/wp-content/uploads/Adventsblasen_002_Priess.jpg)
