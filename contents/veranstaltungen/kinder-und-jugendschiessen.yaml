    ## Schießsport für jedermann

    ## Kinder- & Jugendschießen in Schnackenburg

    ![](https://schnackenburg.de/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-20-at-21.02.34.jpeg)

    🎯 **Kinder- & Jugendschießen in Schnackenburg** 🎯

    Du hast Lust auf Konzentration, Spaß und Treffsicherheit? Dann komm zum Kinder- und Jugendschießen ins Schützenhaus Schnackenburg!

    📅 Jeden Sonntag
    ⏰ 10:00 – 12:00 Uhr
    🔫 Luftgewehr (10 Jahre) & Kleinkaliber (14 Jahre)

    Egal ob Anfänger oder schon erfahren – bei uns sind alle herzlich willkommen. Komm vorbei und probier es aus!

    Mehr Informationen unter: [https://schnackenburg.de/schuetzengilde-schnackenburg/](https://schnackenburg.de/schuetzengilde-schnackenburg/)
