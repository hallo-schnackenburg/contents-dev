    ## Ein Treffpunkt für Besucher aus Nah und Fern

    ![](https://schnackenburg.de/wp-content/uploads/Wappen-neu.png)

    #### Freitag: Abschied des amtierenden Königs

    Jedes volle 3. Wochenende im Juli findet das traditionelle Schützenfest auf dem Schützenplatz in Schnackenburg unter alten Eichen statt.

    Das Schützenfest beginnt traditionell am Freitagnachmittag mit dem Antreten der Schützenbrüder und -schwestern auf dem Marktplatz in Schnackenburg. Anschließend erfolgt die Abholung der Majestäten und ein Ummarsch mit Blasmusik durch Schnackenburg. Am Abend sorgt bei einem **Tanzabend** ein DJ für eine stimmungsvolle Atmosphäre im Festzelt auf dem Schützenplatz.

    #### Samstag: Höhepunkt des Schützenfest - die Königs-Proklamation

    Der Samstag startet mittags auf dem Marktplatz in Schnackenburg mit dem **Fahnenausmarsch** der hiesigen Vereine sowie der Gastvereine. Es findet die Abholung der Majestäten, ein Ummarsch durch Schnackenburg und das Eintreffen auf dem Schützenplatz statt.

    Dort bieten allerlei Vergnügungen Spaß für Jung und Alt: Karusselle, Kuchen, Schausteller-Buden, Preisschießen, Kinderbelustigung und ein vielfältiges Angebot an Speisen und Getränken.

    Den Höhepunkt stellt die **Proklamation um 17 Uhr** der neuen Majestäten durch den Gildemeister und 1. Vorsitzenden dar: Der Feldherrenhügel bietet seit dem Jahr 2000 einen festlichen Anblick für diesen ehrenvollen Moment. Gekrönt werden das neue Königs- und Kronprinzenpaar der Schützengilde mit einem Beinamen, einer Ehrenscheibe und zahlreichen Glückwünschen. Ebenso werden die Kindermajestäten gekrönt. Traditionell wird zum Abschluss der Proklamation ein Kanonenschuss der gildeeigenen Kanone „Barbara vom Eichholz“ abgefeuert und das Schnackenburger Schützenlied gesungen.

    Am Abend wird die Regentschaft der neuen Majestäten mit einem **Tanzabend** eingeläutet.

    ![Fahnenausmarsch der hiesigen Vereine auf dem Marktplatz in Schnackenburg](https://schnackenburg.de/wp-content/uploads/IMG_8726.jpg)

    ![Festumzug durch Schnackenburg mit Tambor-Major, Trommler, Fahnenabordnung, Majestäten, geladenen Gästen, Schützengilde Schnackenburg](https://schnackenburg.de/wp-content/uploads/Bildschirmfoto-2025-01-13-um-17.44.11.png)

    #### Sonntag: krönender Abschluss

    Der Sonntag fängt an mit dem Antreten auf dem Marktplatz, dem Ausmarsch der Fahnen, der Abholung der Majestäten und einem Ummarsch durch Schnackenburg. Anschließend wird im Festzelt das **Königsfrühstück** gereicht. Dabei werden Ehrungen und Beförderungen ausgesprochen. Ein Kuchenverkauf und das Preisschießen auf dem Schießstand sorgen auch am Sonntag für eine rege Beteiligung. Den Abschluss bildet die **Preisverleihung des Preisschießens**.

    #### Schnackenburger Schützenlied

    Das Schnackenburger Schützenlied wird traditionell am Ende der Proklamation gesungen und stellt den krönenden Einstand für die neuen Majestäten dar.

    Text:

    Lydia Jafke

    Ewald Köhn

    Musik:

    Ewald Köhn

    ![](https://schnackenburg.de/wp-content/uploads/1489466.jpg)

    ![Tambor-Major, Gilde-Musiker und Königsanwärter auf dem Marktplatz auf dem Weg zum Königsschießen](https://schnackenburg.de/wp-content/uploads/IMG_0039.jpg)

    #### 3 Wochen vorher: Königsschießen

    Bereits 3 Wochen im Voraus findet das Königsschießen auf dem Schützenplatz mit Schießstand in Schnackenburg statt. Neben der Frage, wer die neuen Majestäten werden, kann dort auch am **öffentlichen Preisschießen** teilgenommen werden. Die Schützenbrüder und Schützenschwestern können zudem ihr Können unter Beweis stellen und auf  Pokale und Orden schießen. Die Bekanntgabe erfolgt jedoch erst am Schützenfestsonntag während des Königsfrühstücks.
