    ## Kirchen

    ![Dorfkirche Kapern ©Jakob Kayser (Quelle: Denkmalatlas Niedersachsen)](https://schnackenburg.de/wp-content/uploads/Dorfkirche-Kapern_001_Kayser.png)

    #### Bemerkenswertes Beispiel neoromanischer Architektur

    Die Dorfkirche Kapern ist ein bemerkenswertes Beispiel neoromanischer Architektur und prägt das Ortsbild von Kapern. Sie wurde in den Jahren 1856 bis 1860 unter der Leitung des renommierten Architekten Conrad Wilhelm Hase erbaut und stellt eine dreischiffige Basilika im Stil mittelalterlicher Kirchenbauten dar.

    #### Architektur und Ausstattung

    Die Dorfkirche wurde als massiver Ziegelbau errichtet und weist ein Querhaus sowie eine kunstvolle Innenausstattung auf. Besonders beeindruckend ist die ornamentale Jugendstilausmalung von 1905. Zu den weiteren Highlights zählen Wandbilder des Dresdners Karl Andreä aus dem Jahr 1870, ein Taufbecken, das dem mittelalterlichen Stil nachempfunden ist und eine pneumatische Orgel von Furtwängler & Hammer, ebenfalls aus dem Jahr 1905. Im Kirchturm hängen zwei Glocken. Eine historische Glocke wurde 1694 gegossen, die zweite moderne Glocke stammt aus dem Jahr 1971 und wurde von Friedrich Wilhelm Schilling gefertigt.

    ![Dorfkirche Kapern 1931 (Quelle: Von einer historischen Postkarte, Wendland-Archiv)](https://schnackenburg.de/wp-content/uploads/Dorfkirche-Kapern_002.jpeg)

    ![Dorfkirche Kapern ©Jakob Kayser (Quelle: Denkmalatlas Niedersachsen)](https://schnackenburg.de/wp-content/uploads/Dorfkirche-Kapern_003_Kayser.jpg)

    #### Restaurierungen und Nutzung

    In den letzten Jahren erfuhr die Kirche umfangreiche Restaurierungsmaßnahmen. Diese umfassten die Sicherung des Mauerwerks gegen Feuchtigkeitsschäden, die Restaurierung der historischen Fenster und die Erneuerung der Innenausmalung. Dank dieser Arbeiten ist das Bauwerk in seiner ursprünglichen Pracht erhalten geblieben und setzt bis heute architektonische und kulturelle Akzente im Wendland. Neben den regulären Gottesdiensten wird die Kirche als Konzertkirche genutzt und bietet ein breites Repertoire von Bläsermusik bis Jazz. Damit wird sie zu einem kulturellen Treffpunkt, der über die traditionellen kirchlichen Funktionen hinausgeht.

    Weitere Informationen: [https://kirchspiel.wir-e.de/kapern-weiter-blick-ins-urstromtal](https://kirchspiel.wir-e.de/kapern-weiter-blick-ins-urstromtal)
