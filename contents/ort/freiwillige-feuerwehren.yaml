    ## Wasser Marsch

    ![](https://schnackenburg.de/wp-content/uploads/Symbol-FFw.jpg)

    #### Drei Feuerwehren bilden den 4. Zug

    Die Ortsfeuerwehren der Gemeinde Schnackenburg bestehend aus Schnackenburg, Kapern und Holtorf bilden den 4. Zug der Samtgemeinde Gartow. Diese ist Träger des Brandschutzes.

    Alle Kameradinnen und Kameraden der Freiwilligen Feuerwehren (FFw) sind ehrenamtlich tätig. Die FFw ist dabei kein Verein, sondern eine Hilfsorganisation, welche sich dem Brand- und Katastrophenschutz verschreibt.

    #### Gemeinsam ist man stark!

    „Gott zur Ehr, dem Nächsten zur Wehr“ spiegelt das Selbstverständnis der Feuerwehr am besten wider. Dabei geht es darum, anderen zu helfen und sich freiwillig gesellschaftlich zu engagieren. Die Feuerwehr steht für den Schutz von Menschen, Tieren und Sachwerten, aber auch für ein soziales Leben vor Ort.

    Getreu ihrem Motto „Retten – Löschen – Bergen – Schützen“ sind die Kameradinnen und Kameraden Tag und Nacht in Bereitschaft. Da sie in schwierigen und bedrohlichen Situationen verlässlich Hilfe leistet und Gefahren abwehrt, genießt die Feuerwehr ein hohes gesellschaftliches Ansehen.

    Kameradschaft und Zusammenhalt liegt der Feuerwehr sehr am Herzen, da man im Einsatz zusammen an einen Strang ziehen muss. Daher ist ein freundliches Miteinander wichtig.

    ![](https://schnackenburg.de/wp-content/uploads/Feuerwehr-Emblem.jpg)

    ![Ausbildungsdienst "Retten und Selbstretten" am Turm an der Schwedenschanze](https://schnackenburg.de/wp-content/uploads/IMG_1800.jpeg)

    #### Feuerwehr ist kein Hexenwerk

    Für den Eintritt in die FFw benötigt man keine Vorkenntnisse. Standort- und überörtliche Ausbildungen ermöglichen es auch Quereinsteigern Fachkunde zu erwerben und Feuerwehrmann beziehungsweise Feuerwehrfrau zu werden. Alles Notwendige an Schutzausrüstung wird gestellt. Alle Bürger und Bürgerinnen – zwischen 16 und 67 Jahren mit Erstwohnsitz in der Stadt Schnackenburg – können als aktives Mitglied ihre jeweilige Ortsfeuerwehr unterstützen.

    Die Ausbildungsdienste sind dabei sowohl theoretisch als auch praktisch angelegt und umfassen verschiedene Bereiche der Tätigkeiten innerhalb der Feuerwehr.

    #### Bereits für Kinder und Jugendliche

    Jugendfeuerwehren sind die Jugendgruppen der Feuerwehr. Ab dem 10. Lebensjahr können Mädchen und Jungen in der Gemeinde Schnackenburg der Jugendfeuerwehr beitreten.

    Kinder und Jugendliche werden dazu begeistert, anderen zu helfen, Verantwortung zu übernehmen und füreinander einzustehen. Die Förderung des Miteinander und die Vermittlung von Feuerwehrwissen stehen dabei im Mittelpunkt. Es werden ihnen die Grundfertigkeiten in der Feuerwehr nahegebracht, die es ihnen ermöglicht in Gefahrensituationen auch selbst korrekt handeln zu können.

    Die Jugendfeuerwehr stellt zudem aufgrund von Wettkämpfen auf regionaler und überregionaler Ebene, Spiel ohne Grenzen, Ausflügen und Zeltlagern eine abwechslungsreiche Freizeitbeschäftigung dar.

    ![Jugendfeuerwehr Kapern bei einem Leistungs-Wettkampf](https://schnackenburg.de/wp-content/uploads/Bildschirmfoto-2025-01-12-um-17.29.56.png)

    ![Ausbildungsdienst "Löschangriff"](https://schnackenburg.de/wp-content/uploads/Bildschirmfoto-2025-01-12-um-18.40.57.png)

    #### Wurde das Interesse geweckt?

    Es ist jederzeit möglich unverbindlich beim Übungsdienst der Ortsfeuerwehr vorbeizuschauen, um sich einen eigenen Eindruck zu verschaffen. Bei Fragen bezüglich der Mitgliedschaft oder um der FFw beizutreten, sollte man nicht zögern und sich bei dem jeweiligen Ortsbrandmeister melden:

