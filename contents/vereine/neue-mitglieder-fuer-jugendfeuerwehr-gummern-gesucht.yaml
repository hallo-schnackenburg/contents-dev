    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

