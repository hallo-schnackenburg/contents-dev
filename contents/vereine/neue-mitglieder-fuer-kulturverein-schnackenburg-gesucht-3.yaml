  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Was zu tun ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
