    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Zur Geschichte

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Anmeldungen sind bis eine Woche vorher möglich.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
