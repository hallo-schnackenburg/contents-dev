  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Was zu tun ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
