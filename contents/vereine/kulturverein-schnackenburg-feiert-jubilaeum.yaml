    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Wer dabei ist

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

