    #### Gemeinsam schmeckt es besser!

    ### Keine Lust mehr, allein zu Hause Mittag zu essen?

    Jeden 3. Mittwoch im Monat können Sie mit uns in der Mehrzweckhalle in 29493 Schnackenburg, Alter Postweg, von Oktober 2025 bis April 2026 gemeinsam essen.

    Zwischen 12.00 Uhr und 13.30 Uhr bieten wir
    Ihnen für 5,00 € einen schmackhaften Eintopf an. Wir freuen uns auf Sie.

    Damit wir besser planen können, bitte Anmelden!

    DRK-Ortsverein Schnackenburg
    Kontakt: Andrea Rosowski
    Telefon: 0 58 40 – 98 97 040
    Mail: drk-ortsverein-schnackenburg@web.de

    ![](https://schnackenburg.de/wp-content/uploads/ovspende.png)

    #### Neue Mitglieder willkommen

    Möchten Sie ein Teil dieser wohltätigen Gesellschaft also förderndes Mitglied werden?

    Wenden sie sich bitte an die Vorsitzende.

