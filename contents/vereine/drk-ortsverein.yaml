    #### Über 100 Jahre DRK-Ortsverein Schnackenburg

    Der DRK-Ortsverein Schnackenburg ist ein Teil des DRK-Kreisverbandes Lüchow Danneberg e.V. und feierte am 10.08.2024 in Schnackenburg sein 100-jähriges Bestehen.

    Die 1. Vorsitzende Andrea Rosowski leitet seit 2018 den Verein und engagiert sich für die Belangen der fördernden Mitglieder. Als 2. Vorsitzende steht Ihr Edeltraut Schermer zur Seite sowie die Kassenwartin Doris Otto und Schriftführerin Beate Weber- Teege.

    Bereits im Jahr 1915 gab es Frauen aus Schnackenburg und Umgebung die unter dem damaligen Namen „Frauenverein-Schwesternstation Schnackenburg“ in einer starken Gemeinschaft gutes für die Allgemeinheit taten und sich einsetzten.

    #### Gemeinnützigkeit und Mitgliederbetreuung im Vordergrund

    2024 hat der Ortsverein 89 Mitglieder, wobei die Mitgliederbetreuung im Vordergrund steht. Mindestens 3-mal im Jahr treffen sich die Mitglieder für Aktivitäten wie Themenfahrten oder Besichtigungen, Frühstück oder Geselligkeitsnachmittage, Feiern und vieles mehr, um den Verbund zu stärken. Termine und Art der Veranstaltung werden jährlich neu bei der Jahreshauptversammlung besprochen und festgelegt.

