    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Wer dabei ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich.

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
