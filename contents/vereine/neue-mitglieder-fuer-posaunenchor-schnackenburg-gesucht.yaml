  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Zur Geschichte

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

