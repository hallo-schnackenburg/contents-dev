  summary: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
