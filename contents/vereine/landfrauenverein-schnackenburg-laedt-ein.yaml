text:
  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Wer dabei ist

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Anmeldungen sind bis eine Woche vorher möglich.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
  teaser: |
