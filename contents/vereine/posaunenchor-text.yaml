    #### Gründung desPosaunenchors für die kleine Stadt

    Im Jahre 1970 war der Gemeindevorsteher Herbert Baumann von seinem Schnackenburger Pastor Fricke ermuntert worden, auf Pastor von Amberg in Gartow  zuzugehen mit der Bitte um Unterstützung bei der Gründung eines Posaunenchors. Anfangs bildete noch der Pastor die Rekruten aus, später übernahm Herbert Baumann diese Rolle. Durch seinen beispiellosen Einsatz entstand ein für diese kleine Stadt eindrucksvoller Bläserchor mit 12 Mitgliedern.

    #### Musik für Schnackenburg und Umgebung

    Zu Geburtstagen, goldenen Hochzeiten, Weihnachtsfeiern des DRK, Bootstaufen, Stadt- und Kappenfest oder kirchlichen Anlässen uvm. wurden Ständchen in und um Schnackenburg vorgetragen.

    ![](https://schnackenburg.de/wp-content/uploads/IMG_4803-Kopie.jpeg)

    ![](https://schnackenburg.de/wp-content/uploads/IMG_5491-Kopie.jpeg)

    #### Die Mitglieder

    Mitglieder im Bläserchor von 1970 – 2020

    Herbert Baumann, Annemarie Boly, Jean Boly, Kurt Jafke, Renate Lütke, Heino Loichen, Klaus Reineke, Siegfried Rogge, Monika Witte, Friedel Witte, Martin Effey, Ilka Reinecke, Edda Dähn, Curt Schlauß, Andre Budras, Rita Bischoff, Angela Rogge, Lutz Lehmann, Marianne Lehmann, Gerd Krumrey, Eberhard Fiedler, Swenja Bluhm, Friedel Hofmann, Fritz Eickmeyer

    #### Die Jungbläser

    **Natürlich musste auch die Jugend ausgebildet werden. Dies übernahm Herbert Baumann**

    *Der Jugend hat man zugemutet,*

    *dass sie auf Blechblasinstrumenten tutet!*

    *Der Baumann erntet viele Jahre,*

    *vom Unterricht nur graue Haare!*

    *Es blieben kurz, nur manche lange –*

    *Die jungen Schüler bei der Stange!*

    *Kommunalpolitik hat sie betrogen –*

    *So sind sie alle davongeflogen!*

    **Einige von Herbert ausgebildete Jungbläser:**

    Burkhard Jafke, Thomas Köhler, Ortwin Szegedi, Uwe Lehmann, Helmut Dunker, Wilhelm Schulz, Markus Schulz, Joachim Schermer, Henry Schermer, Michael Schermer, Ditrich Teschner, Ilka Reinicke, Marko Tietke, Kai Witte, Andre Witte, Andreas Schulz, Klaus Maleschka, Andreas Wenzlaff, Michael Wenzlaff, Christian Schulz, Henning Krumrey, Alexander Jessen, Bastian Elstner, Michael Kubel

    ![Uwe Lehmann, Thomas Köhler und Helmut Dunker, drei damalige Jungbläser](https://schnackenburg.de/wp-content/uploads/IMG_5484-Posaunenchor-Nachwuchs.jpeg)

    ![](https://schnackenburg.de/wp-content/uploads/IMG_5282-Kopie-2.jpeg)

    #### Kreisposaunenfest 1986

    1986 fand das Kreisposaunenfest in Schnackenburg an der St. Nicoleikirche statt. Zu dieser Zeit leitet Karl Heinz Loichen den Posaunenchor.

    Dirigenten von 1970-2020:

    Herbert Baumann, Heino Loichen, Edda Dähn, Friedel Hofmann

    Auch hierzu ein Gedicht: Man schwingt den Stab, und freut sich dann, wenn man beschwingtes hören kann!

    **2020 feierte der Posaunenchor sein 50 Jähriges Bestehen.**

