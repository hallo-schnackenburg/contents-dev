    ## Wer dabei ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

