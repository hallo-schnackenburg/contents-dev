    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Was zu tun ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
