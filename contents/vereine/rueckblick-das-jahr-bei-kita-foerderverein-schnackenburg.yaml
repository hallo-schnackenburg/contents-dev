    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Was zu tun ist

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Anmeldungen sind bis eine Woche vorher möglich.
