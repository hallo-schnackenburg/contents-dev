title: Förderverein Schubertiaden Schnackenburg e.V.
published: 2025-03-22
text:
  body: |
    ![](https://schnackenburg.de/wp-content/uploads/verein-logo.png)

    Die Mitglieder des Fördervereins Schubertiaden Schnackenburg e.V. haben sich zum Ziel gesetzt, die Idee der Schubertiaden durch selbstlose Förderung zu erhalten und kommerzielle Aspekte möglichst fernzuhalten. Da zu den Konzerten keine Eintrittskarten verkauft werden, können die Reise-, Verpflegungs-, Unterbringungs- und sonstige Kosten ausschließlich durch Mitgliedsbeiträge, Konzertspenden sowie durch Spenden von Sponsoren aufgebracht werden. In diesem Sinne kann sich der Verein rühmen, ein musikalisches Kleinod geschaffen und bewahrt zu haben, das Musikliebhaber aus allen Teilen Deutschlands zu schätzen wissen.

    #### Spendenbasiertes Festival

    Seit der Gründung ist das Kammermusikfestival spendenbasiert. Inspiriert von Franz Schuberts Idee von Konzerten im Kreis von Freunden, wird jedem Interessierten ermöglicht, die Schubertiade in Schnackenburg zu besuchen. Herausragende internationale Kammermusikerinnen und -musiker um Arkadi Zenzipér kommen jährlich zu den Konzerten und spielen für die Zuhörer ohne Honorar. Statt dem Kauf von Tickets werden im Anschluss an die Konzerte Spendenkörbe an den Ausgängen der St. Nicolai Kirche bereitgestellt und Spenden erbeten. Die Spenden werden verwendet, um die Kosten für die Anreise, Unterkunft und Verpflegung der MusikerInnen sowie die gesamte Durchführung des Festivals zu gewährleisten. Ohne den Spenden an den Konzertabenden und darüber hinaus wären die Schubertiaden Schnackenburg nicht zu realisieren.

    ![Duo Zenziper ©Mafalda Lee](https://schnackenburg.de/wp-content/uploads/Foerderverein-Schubertiaden_002_Lee.jpg)

    ![Kammermusikensemble ©Mafalda Lee](https://schnackenburg.de/wp-content/uploads/Foerderverein-Schubertiaden_003_Lee.jpg)

    #### Nachwuchsförderung

    Der Förderverein Schubertiaden Schnackenburg e.V. vergibt zudem in Kooperation mit Sponsoren Förderpreise für ausgewählte Nachwuchsmusiker. Diese qualifizieren sich im Voraus und erhalten neben der Konzertiermöglichkeit ein Preisgeld.

    ###### **Geschäftsführerin:** Laura Zenziper

