    ## Anglerverein Schnacken­burg und Umg. e.V.

    ![](https://schnackenburg.de/wp-content/uploads/FAHNE-FISH-LOGO-FINAL.jpg)

    #### Tradition und Gemeinschaft am Wasser

    Der Anglerverein Schnackenburg und Umg. e.V. gehört zu den traditionsreichen Vereinen der Stadt. Gegründet am 6. Dezember 1947, bietet er Anglerinnen und Anglern eine Gemeinschaft, in der das gemeinsame Hobby im Mittelpunkt steht und die sich für die Pflege der Gewässer und den Erhalt der Natur einsetzt. Ein besonderes Ereignis in der Vereinsgeschichte war die Fahnenweihe am 12. Mai 1973. Seitdem ist die Vereinsfahne ein Symbol für Zusammenhalt und Tradition. Heute zählt der Verein fast 100 Mitglieder. Neue Mitglieder können derzeit nicht aufgenommen werden.

    ![](https://schnackenburg.de/wp-content/uploads/Anglerverein_001_Slomka.jpg)

    ###### **1.** **Vorsitzender:** Andreas Bohlmann, Tel.: 05840-989976
