    ## Wer dabei ist

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
