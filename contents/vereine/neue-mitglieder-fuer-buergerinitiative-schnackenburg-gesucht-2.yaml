    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Wer dabei ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
