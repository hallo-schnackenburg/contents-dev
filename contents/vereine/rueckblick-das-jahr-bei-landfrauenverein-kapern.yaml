text:
  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Hintergrund

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
