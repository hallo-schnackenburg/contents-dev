title: Schifferbrüderschaft Schnackenburg von 1893
published: 2026-04-15
text:
  body: |
    ![](https://schnackenburg.de/wp-content/uploads/Logo_Schifferbruederschaft_Schnackenburg_klein.png)

    #### Einigkeit seit über 130 Jahren

    Die Stadt Schnackenburg ist als ehemalige Zollstation seit alters her von der Elbschifffahrt und der damit verbundenen wechselvollen Geschichte geprägt. Davon zeugen heute noch die vielen Fahnenmasten vor den Häusern der Stadt. Zu Zeiten, als auf der Elbe noch Kettenschifffahrt betrieben wurde und Raddampfer unterwegs waren, taten sich die damaligen Schifffahrtstreibenden und Fischermeister von Schnackenburg zusammen und gründeten am 12. Februar 1893 die „Schiffer-Brüderschaft zu Schnackenburg“.

    #### Gemeinnützigkeit im Vordergrund

    Zweck der Schifferbrüderschaft war die Einigung sämtlicher Schiffer, die Hebung des Schifferstandes und vor allem die gegenseitige Unterstützung. Der entbehrungsreiche Beruf und die harten Arbeitsbedingungen machten einen starken Rückhalt in der Gemeinschaft besonders wichtig. Das von den Schiffern in den Sommermonaten praktisch erlernte sollte in den Wintermonaten untereinander weitergegeben werden. Ein aus den Mitgliedsbeiträgen gebildeter Fonds diente zur finanziellen Unterstützung von hilfsbedürftigen Mitgliedern bei unverschuldeter Krankheit oder von Hinterbliebenen mit einem Sterbegeld.

    ![Raddampfer "Schnackenburg" der Reederei Heuer um 1900 ©Schifferbrüderschaft Schnackenburg](https://schnackenburg.de/wp-content/uploads/2025/03/Raddampfer-Schnackenburg_1900.jpg)

    ![Fahnenweihe 1961 ©Schifferbrüderschaft Schnackenburg](https://schnackenburg.de/wp-content/uploads/2026/04/Fahnenweihe_1961_04-scaled-1.webp)

    #### Gelebter Zusammenhalt bis heute

    In der heutigen Zeit stehen in der Schifferbrüderschaft die Gemeinschaft, die Geschichte der Elbschifffahrt und die damit verbundenen Traditionen im Vordergrund. Die stolze Präsentation der historischen Vereinsfahne mit der Aufschrift “Ob zu Wasser, ob zu Land, immer in Gottes Hand” ist Ausdruck dieses starken Zusammenhalts. Früher fand jährlich in den Wintermonaten der traditionelle Schifferball statt, zu dem auch die Familien und in Schnackenburg überwinternde fremde Schiffer eingeladen wurden. Heute findet jedes Jahr das Kreisschiffertreffen der Kreisschiffervereinigung Elbe und Umgebung statt, dem neben der Schifferbrüderschaft Schnackenburg sechs weitere Schiffervereine angehören. In diesem Jahr findet das [Kreisschiffertreffen am 15. August 2026 in Schnackenburg](https://schnackenburg.de/kreisschiffertreffen-schnackenburg/) statt.

    #### Neue Mitglieder willkommen

    Seit vielen Jahren können nicht nur Schifffahrtstreibende Mitglied werden, sondern alle Interessierten, die sich mit der Kultur verbunden fühlen und mit den Werten identifizieren können. Aktuell zählt die Schifferbrüderschaft 44 Mitglieder mit 11 Frauen und 33 Männern. Repräsentativer Ort der Schifferbrüderschaft ist der auf dem Deich in Schnackenburg stehende [Fahnenmast](https://www.future-history.eu/de/ansicht/fahnenmast-am-elbdeich-schnackenburg-1973-stephan) und der dazugehörige Platz mit wunderbarem Blick auf die Elbe.

    Werdet gerne Mitglied und nutzt dafür einfach die **[Beitrittserklärung](https://schnackenburg.de/wp-content/uploads/2026/07/2026-07-16_SBS_Beitrittserklaerung.pdf)** oder schreibt uns an **schifferbruederschaft@mailbox.org**

    ![Das Wahrzeichen der Schifferbrüderschaft: Die über 125 Jahre alte "Schnacke" © Stephan Prieß](https://schnackenburg.de/wp-content/uploads/Schifferbruederschaft_004.jpg)

