    ## LandFrauen-Verein

    ![](https://schnackenburg.de/wp-content/uploads/Landfrauen_Logo.jpg)

    #### Seit über 75 Jahren

    Den LandFrauenverein Gartow mit seinen weit über 100 Mitgliedern gibt es seit über 75 Jahren. Das Vereinsgebiet ist die Samtgemeinde Gartow. Der LF Gartow ist Mitglied im LandFrauen Kreisverband Lüchow-Dannenberg und im LandFrauen Landesverband Hannover.

    Es gibt ganzjährig Veranstaltungen, wobei die Gemeinschaft verbindet und viel bewegen kann. Mit unserer Bildungsarbeit greifen wir aktuelle Themen auf und schaffen Perspektiven für Frauen im ländlichen Raum. LandFrauen sind das richtige Forum, um vielerlei Interessen zu erörtern, zu bündeln und wirksam zu präsentieren.

    LandFrau werden kann jede im ländlichen Raum lebende Frau.

    Wir freuen uns auf Euch!

