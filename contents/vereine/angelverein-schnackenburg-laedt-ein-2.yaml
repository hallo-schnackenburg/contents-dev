title: Angelverein Schnackenburg lädt ein
authors:
  - ingrid-peters
about:
  - angelverein-schnackenburg
text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Wer dabei ist

    Anmeldungen sind bis eine Woche vorher möglich. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
  summary: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
