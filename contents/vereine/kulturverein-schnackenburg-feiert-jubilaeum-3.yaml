    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Was zu tun ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Anmeldungen sind bis eine Woche vorher möglich.

