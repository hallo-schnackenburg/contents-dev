title: Neue Mitglieder für Kulturverein Schnackenburg gesucht
about:
  - kulturverein-schnackenburg
published: 2024-04-11
text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Hintergrund

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Anmeldungen sind bis eine Woche vorher möglich.
  teaser: |
