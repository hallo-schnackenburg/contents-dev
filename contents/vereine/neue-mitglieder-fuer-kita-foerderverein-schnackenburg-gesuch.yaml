  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    ## Zur Geschichte

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Anmeldungen sind bis eine Woche vorher möglich. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
