    #### Ein Blick auf Geschichte und Engagement

    Der Turn- und Sportverein (TuS) Schnackenburg, gegründet im Jahr 1863, ist nicht nur einer der ältesten Sportvereine Deutschlands, sondern auch ein zentraler Bestandteil des gesellschaftlichen Lebens in Schnackenburg.

    #### Die Gründung und erste Jahre

    Die Ursprünge des TuS Schnackenburg reichen in die Zeit der deutschen Turnbewegung zurück, die von Friedrich Ludwig Jahn inspiriert wurde. Nur sechs Kilometer von Schnackenburg entfernt wurde Jahn in Lanz geboren, dessen Ideen über körperliche und geistige Ertüchtigung auch hier Anklang fanden. Ursprünglich als „Männerturnverein Germania“ gegründet, war dieser ausschließlich Männern vorbehalten und konzentrierte sich in der damaligen Zeit auf Disziplin und körperliche Fitness.

    ![Schnackenburger Männerturnverein um 1900](https://schnackenburg.de/wp-content/uploads/TuS_002-2.jpg)

    ![](https://schnackenburg.de/wp-content/uploads/Fitnesspark_Schaefer-21.jpg)

    #### Engagement und Wachstum in der Nachkriegszeit

    Die beiden Weltkriege und die Weltwirtschaftskrise führten zu Unterbrechungen des Vereinslebens. Nach dem Zweiten Weltkrieg kam es 1946 zu einem erfolgreichen Neubeginn, und in den 1950er und 1960er Jahren wuchs der TuS Schnackenburg wieder und erweiterte sein sportliches Angebot. Frauen- und Kindersport wurden in das Programm aufgenommen, und die Vereinsleitung engagierte sich für die Förderung von Gemeinschaft und Gesundheit. Im Laufe der Jahrzehnte entwickelte sich der Verein stetig weiter. Neben sportlichen Aktivitäten wie Turnen, Fußball und später Handball, Tischtennis und Judo wurden gesellschaftliche Zusammenkünfte wie Bälle, Theateraufführungen und Ausflüge ein fester Bestandteil des Vereinslebens. Die 1970er und 1980er Jahre waren geprägt von sportlichen Erfolgen, etwa im Handball und Fußball. Der Verein organisierte zahlreiche Sportfeste und Turniere und blieb ein zentraler Ort des sozialen Lebens. Seit 1986 nutzt der Verein die zur Mehrzweckhalle umgebaute ehemalige Schule am Alten Postweg. Im Rahmen der Sportiven Landpartie des KreisSportBundes sorgt der TuS Schnackenburg seit 1998 immer wieder mit attraktiven Spielen und Übungen für ein kurzweiliges und belebendes Bewegungsangebot.

    #### Der TuS Schnackenburg heute

    Auch im 21. Jahrhundert hat sich der TuS Schnackenburg als vielseitiger Sportverein etabliert. Ehemalige Gruppen wie die Mini-Dance-Kids und die Power-Girls zeugen von der Kreativität und dem Engagement des Vereins. Das jeden Dienstagnachmittag stattfindende Seniorenturnen und die darauffolgenden Frauen- und Männerturngruppen am Abend erfreuen sich ebenfalls großer Beliebtheit. Hinter der Mehrzweckhalle konnte am 4. August 2024 im Rahmen der 25. Sportiven Landpartie zusätzlich ein moderner Fitnesspark feierlich eröffnet werden. Der Fitnesspark richtet sich an alle Sportbegeisterten und ergänzt ideal das bestehende Sportprogramm des TuS Schnackenburg. Mit einer Mischung aus Tradition und Innovation bleibt der Verein ein lebendiger Ort des Austauschs und der Bewegung.

    ![Einweihungsfeier des Fitnessparks 2024](https://schnackenburg.de/wp-content/uploads/Fitnesspark_Schaefer-10.jpg)

