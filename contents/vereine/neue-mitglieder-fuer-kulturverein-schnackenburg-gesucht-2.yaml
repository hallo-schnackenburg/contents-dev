    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Was zu tun ist

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
