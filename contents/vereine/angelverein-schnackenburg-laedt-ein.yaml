  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Was zu tun ist

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
