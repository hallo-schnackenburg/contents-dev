    #### Schießsport für jedermann

    **Übungsschießen für die Öffentlichkeit:**

    -   Lichtpunktgewehr
    -   Luftgewehr (ab 10 Jahre)
    -   Kleinkaliber (ab 14 Jahre)
    -   Dart spielen

    **Wann?**

    Freitags, 18.30-21.00 Uhr

    Sonntags, 10.00-12.00 Uhr

    **Wer?**

    alle Interessierte, jede Altersgruppe

    **Wo?**

    Schießstand Schützenhaus Schnackenburg

    **Warum?**

    Üben für Firmen- und Vereinsschießen, Bedingungen schießen, Schießsport ausüben, für die Geselligkeit, etc.

    **Informationen zum Kinder- und Jugendschießen**: [https://schnackenburg.de/kinder-und-jugendschiessen/](https://schnackenburg.de/kinder-und-jugendschiessen/)

