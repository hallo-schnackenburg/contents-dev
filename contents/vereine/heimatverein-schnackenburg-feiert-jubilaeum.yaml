text:
  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Anmeldungen sind bis eine Woche vorher möglich.

    ## Zur Geschichte

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben.
