text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Anmeldungen sind bis eine Woche vorher möglich.

    ## Zur Geschichte

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
