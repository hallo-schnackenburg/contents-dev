    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich.

    ## Wer dabei ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
