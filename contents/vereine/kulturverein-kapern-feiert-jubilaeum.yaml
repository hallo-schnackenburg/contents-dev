  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Was zu tun ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Anmeldungen sind bis eine Woche vorher möglich.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
