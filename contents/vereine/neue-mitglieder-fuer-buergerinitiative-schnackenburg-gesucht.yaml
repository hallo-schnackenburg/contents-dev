text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Zur Geschichte

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Anmeldungen sind bis eine Woche vorher möglich. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
