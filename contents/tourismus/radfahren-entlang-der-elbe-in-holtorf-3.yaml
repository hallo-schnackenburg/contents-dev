    ## Hintergrund

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
