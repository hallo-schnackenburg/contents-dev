    ## Was zu tun ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
