text:
  body: |
    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Wer dabei ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
  summary: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Anmeldungen sind bis eine Woche vorher möglich.
