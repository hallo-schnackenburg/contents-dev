title: Übernachten in Gummern
authors:
  - lars-ahrens
published: 2022-09-28
text:
  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Was zu tun ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
