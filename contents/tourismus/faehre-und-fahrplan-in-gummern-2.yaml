    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
