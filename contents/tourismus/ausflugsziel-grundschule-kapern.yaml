    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Wer dabei ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
