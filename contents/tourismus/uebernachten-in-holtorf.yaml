    ## Zur Geschichte

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

