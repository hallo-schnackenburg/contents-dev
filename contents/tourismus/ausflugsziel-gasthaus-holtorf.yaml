    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Wer dabei ist

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
