  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Was zu tun ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

