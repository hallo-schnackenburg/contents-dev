  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Zur Geschichte

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
