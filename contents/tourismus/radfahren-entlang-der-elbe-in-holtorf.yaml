    ## Hintergrund

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
