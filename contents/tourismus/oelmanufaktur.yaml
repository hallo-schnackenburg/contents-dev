    ## Einkaufsläden

    ## Einkaufen in Schnackenburg

    ![In verschiedenen Behältnissen abgefüllte Öle ©privat](https://schnackenburg.de/wp-content/uploads/schnackenburg-oehlmuehle-web-2.jpg)

    ![Karola Marquardt beim Pressen der Saaten ©privat](https://schnackenburg.de/wp-content/uploads/schnackenburg-oehlmuehle-web-1.jpg)

    ### Ölmanufaktur Dreyer

    #### Inh. Karola Marquardt – Elbstrasse 7, 29493 Schnackenburg

    Seit 1999 gibt es die Ölmanufaktur Dreyer mit ihren frisch hergestellten Speiseölen. Die ersten Jahre waren wir in einem kleinen Ort in der westlichen Altmark angesiedelt, bevor wir 2009 nach Schnackenburg an der Elbe umgezogen sind. Unsere frisch hergestellten Speiseöle werden unter 40 °C kaltgepresst gewonnen, nicht gefiltert oder konserviert und noch per Hand abgefüllt. Unsere Ausgangssaaten stammen aus kontrolliert biologischem Anbau. Bei uns bleibt das Öl so naturbelassen wie möglich. Es wird in kleinen Mengen produziert und über den Versand direkt an den Kunden verschickt oder ist in unserem kleinen Laden in Schnackenburg erhältlich. Außer unseren Speiseölen gibt ein kleines Angebot von erlesenen Frucht-Balsamessigen, Himalaya Kristallsalz, Gemüse- und Gewürznudeln und Tiroler Steinölprodukten. Der Wendlandmarkt in Lüchow und der Grünland-Bioladen in Salzwedel führen ebenfalls unsere Produkte.

    Wer mehr wissen möchte kann gern anrufen: Tel. 05840-989367 oder eine E-Mail schicken: [dreyeroelmanufaktur@web.de](mailto:dreyeroelmanufaktur@web.de).

    Öffnungszeiten für den Laden bitte auch telefonisch erfragen. Eine aktuelle Preisliste können Sie bei uns anfordern.

    Webseite: [http://www.oelmanufaktur-dreyer.de/](http://www.oelmanufaktur-dreyer.de/)

    Wir freuen uns über Ihr Interesse, Ihren Besuch oder Ihre Anfragen.
