text:
  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Wer dabei ist

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
