text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Wer dabei ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
