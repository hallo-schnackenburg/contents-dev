    ## Einkaufsläden

    ## Floristik  mit Herz

    ![](https://schnackenburg.de/wp-content/uploads/Koepke_001.jpg)

    ![©Köpke Kreativ](https://schnackenburg.de/wp-content/uploads/Koepke-Kreativ-3.jpg)

    ![©Köpke Kreativ](https://schnackenburg.de/wp-content/uploads/Koepke-Kreativ-11.jpg)

    ### Floristin Christina Köpke

    Ich bin gelernte Floristin und war über 10 Jahre als Floristin in einer Gärtnerei tätig.

    Das kreative an dem Beruf, die Blumen Dekorationen zu erschaffen, die die Kunden erfreut, das ist es, was ich am meisten liebe. Inzwischen habe ich 3 Kinder und einen Mann mit einem großen Hof. Durch den Platz auf dem Hof entschieden wir uns, den Laden hier auszubauen.

    #### Eröffnung im März 2024

    Im März 2024 war es dann so weit das ich eröffnen konnte. Angefangen habe ich mit Schnittblumen und Topfpflanzen.

    Ich biete dem Kunden eine Auswahl an Sträußen und Pflanzungen, die zu meinen Öffnungszeiten gekauft werden können. Wenn große Feiern wie Jubiläen, Geburtstage, Hochzeiten oder Taufen anstehen, freue ich mich mit dem Kunden ein persönliches Gespräch über die Gestaltung zu führen. Auch bei traurigen Anlässen, wie Beisetzungen, findet ihr meine Unterstützung. Ich gestalte Grabgestecke, Sarg- und Urnenschmuck nach euren Vorstellungen.

    Auch für andere Feierlichkeiten könnt ihr mich anrufen. So durfte ich letztes Jahr den Tischschmuck zum Winterball für den Lionsclub anfertigen.

    Zum Tag des offenen Friedhofes wurde ich von der Firma Schulz aus Rebenstorf beauftragt, ihre Ausstellung zu dekorieren.

    Dadurch das ich mich für einen Laden in Holtorf entschieden habe, kann ich sehr flexible Abholzeiten anbieten. Auch das Bestellen über die Sozialen Medien wird gern gewählt. Also kommt gerne zu mir, ruft an oder schreibt mir gern und wir besprechen eure Blumenwünsche.

    **Köpke Kreativ
