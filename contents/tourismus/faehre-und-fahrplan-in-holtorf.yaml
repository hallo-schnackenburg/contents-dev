text:
  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Hintergrund

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
