    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
