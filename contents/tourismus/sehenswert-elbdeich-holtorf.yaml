  body: |
    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Hintergrund

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
