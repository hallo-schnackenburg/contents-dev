text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Zur Geschichte

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
