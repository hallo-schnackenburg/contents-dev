    ## Wer dabei ist

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

