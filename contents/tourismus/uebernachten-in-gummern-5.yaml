  summary: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
