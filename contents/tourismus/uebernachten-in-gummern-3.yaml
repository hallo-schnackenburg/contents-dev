text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Was zu tun ist

    Anmeldungen sind bis eine Woche vorher möglich. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben.
