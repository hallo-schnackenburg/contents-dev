    Anmeldungen sind bis eine Woche vorher möglich. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Anmeldungen sind bis eine Woche vorher möglich. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
