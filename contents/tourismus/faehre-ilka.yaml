    ## Über die Elbe

    ![](https://schnackenburg.de/wp-content/uploads/Faehre-Ilka_001_Priess-1.png)

    #### Jungfernfahrt kurz nach der Wende

    Am 7. September 1991 absolvierte die Elbfähre “Ilka” ihre Jungfernfahrt zwischen der Stadt Schnackenburg und dem gegenüberliegenden Lütkenwisch auf der brandenburgischen Elbseite. Durch diese bedeutsame erste Überfahrt wurde die bereits seit Anfang des 17. Jahrhunderts bestehende historische Fährverbindung wiederbelebt. Auf Grund der innerdeutschen Teilung war diese 46 Jahre lang unterbrochen.

    #### Initiative aus Schnackenburg

    Die Ilka hat eine weitaus längere Geschichte vor ihrer jetzigen Aufgabe als Elbfähre. Ursprünglich als Grundseilfähre 1941 in den Niederlanden erbaut beförderte sie viele Jahrzehnte Personen und Fahrzeuge über die Maas. Inspiriert von den ersten erfolgreich wieder aufgenommenen Elbfähren nach der Wende ergriff der Schnackenburger Kapitän Klaus Reineke die Initiative und erwarb die Ilka von der niederländischen Reederei. Nach einem Jahr der Umrüstung und Modernisierung auf einen zweimotorigen Dieselantrieb der Firma Deutz mit jeweils 64 PS konnte die Ilka 1991 ihren Dienst aufnehmen.

    ![Plakat zur Eröffnung der Fährverbindung Schnackenburg - Lütkenwisch](https://schnackenburg.de/wp-content/uploads/Faehre-Ilka_002.png)

    ![](https://schnackenburg.de/wp-content/uploads/Faehre-Ilka_003_Priess.png)

    #### Umfassende Sanierung nach Spendenaktion

    Mit einer Länge von 28 m und einer Breite von 9,5 m kann die Elbfähre bis zu 6 PKW befördern. Für die anspruchsvolle Manövrierfähigkeit auf der strömungsstarken Elbe sorgen zwei Schottel-Ruderpropeller. Um den so wichtigen Fährbetrieb dauerhaft zu sichern, ist die Ilka seit 2017 im Besitz der Stadt Schnackenburg. Betrieben wird die Fähre vom Amt Lenzen im Landkreis Prignitz im Rahmen des Öffentlichen Personennahverkehrs, was eine direkte Busanbindung am Fähranleger Lütkenwisch ermöglicht. 2022 wurde die mittlerweile über 80-jährige Fähre mit Unterstützung einer Spendenaktion in einer Werft umfassend aufgearbeitet. In neuem Glanz erstrahlt stellt Ilka weiterhin für viele Pendler und Touristen ganzjährig von morgens bis abends die Elbüberquerung sicher.
