text:
  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Anmeldungen sind bis eine Woche vorher möglich.

    ## Zur Geschichte

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

