title: Übernachten in Schnackenburg
published: 2026-08-13
text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Anmeldungen sind bis eine Woche vorher möglich. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
