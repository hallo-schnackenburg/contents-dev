    ## Zur Geschichte

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
