text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich.

    ## Zur Geschichte

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
