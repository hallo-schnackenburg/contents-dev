  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Hintergrund

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
