text:
  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Hintergrund

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Anmeldungen sind bis eine Woche vorher möglich.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
