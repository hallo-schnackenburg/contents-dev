    ## Zur Geschichte

    Anmeldungen sind bis eine Woche vorher möglich. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben.
