    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Hintergrund

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

