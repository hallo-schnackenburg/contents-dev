    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Zur Geschichte

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
  summary: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
