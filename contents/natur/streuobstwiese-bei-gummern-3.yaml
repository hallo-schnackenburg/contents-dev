text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Zur Geschichte

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
