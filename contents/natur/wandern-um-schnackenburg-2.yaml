    ## Wer dabei ist

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
