    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Was zu tun ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
