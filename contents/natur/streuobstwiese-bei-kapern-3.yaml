  body: |
    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Was zu tun ist

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
