    ## Bademöglichkeiten und Wellness

    ## Elbestrand, Badestelle Stresow, Gartower See, Therme

    ![Baden im Gartower See](https://schnackenburg.de/wp-content/uploads/schnackenburg_©JSlomka_badesee.jpg)

    #### Baden im Grenzland

    Eingebettet in landschaftlich reizvoller Lage gibt es in der unmittelbaren Umgebung von Schnackenburg gleich zwei interessante Naturbadeseen. Der kleinere von beiden ist der nur 3 km entfernte Stresower See an der Gedenkstätte Stresow mit kleinem Strand und Liegewiese. Parkpklätze sind vorhanden, Tisch-Bank-Kombinationen für ein mitgebrachtes Picknick stehen bereit.

    #### Naherholung in Gartow

    Rund 9 km entfernt von Schnackenburg liegt der Gartower See im benachbarten Gartow. Dieser See wurde in den 1970er Jahren zur Naherholung angelegt und wird durch den Elbenebenfluss Seege durchflossen. Ein ca. 5 km langer Rundweg mit vielen Ruhebänken lädt zum Spazierengehen und Radfahren ein. Zwei Badestrände jeweils am Nord- und Südufer sorgen im Sommer für Abkühlung. Stand-Up-Paddling, Tretboote fahren, Surfen und Segeln sind auf dem Gartower See ebenfalls möglich. Rund um den See gibt es diverse Einkehrmöglichkeiten.

    ![](https://schnackenburg.de/wp-content/uploads/Gartow_004_Priess.jpg)

    ![Familientherme Gartow Eingang](https://schnackenburg.de/wp-content/uploads/schnackenburg-therme-spruehfunke_MG_0190.jpg)

    #### Spaß und Entspannung in der Familientherme

    Ebenso vielfältig ist das ganzjährige Angebot der Bade- und Saunalandschaft der [Familientherme Gartow](http://www.familientherme-gartow.de). Schwimmen und Riesenrutsche, Aquagymnastik und Massage, Solebecken und Themensaunen – Für jeden von groß bis klein ist etwas dabei. Der Außenbereich und eine Sonnenterrasse laden zum Entspannen ein.
