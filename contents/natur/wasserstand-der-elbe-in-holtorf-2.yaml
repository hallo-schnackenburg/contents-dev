text:
  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Anmeldungen sind bis eine Woche vorher möglich.

    ## Zur Geschichte

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
