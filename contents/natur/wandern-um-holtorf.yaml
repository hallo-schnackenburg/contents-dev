    ## Zur Geschichte

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

