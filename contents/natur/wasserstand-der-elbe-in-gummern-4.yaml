type: content
title: Wasserstand der Elbe in Gummern
published: 2026-03-24
text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Wer dabei ist

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Anmeldungen sind bis eine Woche vorher möglich.
  summary: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
