text:
  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Was zu tun ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
