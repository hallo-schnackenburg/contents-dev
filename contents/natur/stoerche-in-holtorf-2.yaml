  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Anmeldungen sind bis eine Woche vorher möglich.

    ## Was zu tun ist

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
