    ## Wer dabei ist

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
