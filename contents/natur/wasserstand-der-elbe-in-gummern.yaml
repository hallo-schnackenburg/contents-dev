text:
  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Zur Geschichte

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Anmeldungen sind bis eine Woche vorher möglich.
