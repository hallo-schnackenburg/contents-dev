text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Hintergrund

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Anmeldungen sind bis eine Woche vorher möglich.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
