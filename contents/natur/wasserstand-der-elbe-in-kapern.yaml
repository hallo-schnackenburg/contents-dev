text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Hintergrund

    Anmeldungen sind bis eine Woche vorher möglich. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    Anmeldungen sind bis eine Woche vorher möglich. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
