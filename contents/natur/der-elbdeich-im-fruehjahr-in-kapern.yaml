title: Der Elbdeich im Frühjahr in Kapern
published: 2026-01-22
text:
  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Anmeldungen sind bis eine Woche vorher möglich.

    ## Was zu tun ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Anmeldungen sind bis eine Woche vorher möglich.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben.
