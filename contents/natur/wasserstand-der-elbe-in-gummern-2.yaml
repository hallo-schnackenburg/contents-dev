    ## Wer dabei ist

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
