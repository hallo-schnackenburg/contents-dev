    ## Zur Geschichte

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
