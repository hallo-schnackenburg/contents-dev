    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Zur Geschichte

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

