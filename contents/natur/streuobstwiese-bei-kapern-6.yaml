title: Streuobstwiese bei Kapern
about:
  - schnackenburg/kirchstrasse/8
published: 2026-04-10
text:
  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Hintergrund

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
  summary: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
