type: content
title: Wandern um Gummern
authors:
  - kulturverein-kapern
published: 2024-01-14
text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Wer dabei ist

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Anmeldungen sind bis eine Woche vorher möglich.
