text:
  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Hintergrund

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
