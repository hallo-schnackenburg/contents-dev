    ## Im Dunkel der Nacht

    ## Ein besonderes Sternenparadies

    ![Kirche zu Holtorf ©jslomka](https://schnackenburg.de/wp-content/uploads/MG_3370-©jslomka-web.jpg)

    Das Wendland und die Altmark gehören auf Grund der dünnen Besiedlung zu den Regionen Deutschlands mit der geringsten Lichtverschmutzung. Der Nachthimmel im Landkreis Lüchow-Dannenberg erreicht deutschlandweit Spitzenwerte auf der Dunkelheits-Skala. Auch in Schnackenburg ist die Chance auf einen fantastischen Sternenhimmel besonders hoch. Besonders gut lassen sich Sterne vom Elbdeich aus beobachten oder von dem 14 Meter hohen Aussichtsturm am Schnackenburger Hafen. Ab August, wenn die Nächte wieder länger werden, ist der Blick in die Sterne besonders lohnenswert. Je später die Nacht, desto besser. In der ersten Augusthälfte sorgen zudem die Perseiden für außergewöhnlich viele Sternschnuppen. Bei Sonnenstürmen und günstigen Wetterbedingungen besteht sogar die Chance auf Polarlichter.

    #### Sternennächte im Vierländereck

    Schon seit Jahren ist der bekannte Fotograf Helmut Schnieder in der Region unterwegs und nimmt Nacht für Nacht spektakuläre Aufnahmen auf. Die Sternenfotografie ist eine Wissenschaft für sich. Akribische Planung der Motive und Berechnung der Sternen Positionen machen nur einen Teil dieses besonderen Hobbies aus. In seinem Buch “Sternennächte im Vierländereck“ findet man viele der einzigartigen Aufnahmen und Informationen zu diesem Thema.

