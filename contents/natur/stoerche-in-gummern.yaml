  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Wer dabei ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
