    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.
