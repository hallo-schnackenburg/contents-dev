    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Hintergrund

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Anmeldungen sind bis eine Woche vorher möglich. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
