    ## Fit for fun auf dem Sportplatz

    ![Feierliche Eröffnung 2024: Im Hintergrund v. Links: Matthias Köhler (Bürgermeister), Ute Meyer (Vorsitzende der LandFrauen), Christian Järnecke (Samtgemeindebürgermeister)](https://schnackenburg.de/wp-content/uploads/Fitnesspark_001_Schaefer.jpg)

    ### IndividuellesTraining
    im Freien

    Der moderne Outdoor-Fitnesspark auf dem Sportplatz am Alten Postweg umfasst elf verschiedene Fitness- und Kraftsportgeräte, ein Trampolin, eine Tischtennisplatte und Fußballtore und bietet hervorragende Möglichkeiten für individuelles Training im Freien.

    #### Idee von Jugendlichen

    Die Idee zum Fitnesspark entstand aus einem Impuls junger Menschen heraus: Einige von ihnen hatten von der Fördermöglichkeit des Landes Niedersachsen zur Unterstützung von Jugendplätzen in ländlichen Gemeinden erfahren und den Antrag in Zusammenarbeit mit Stadtvertretern beim Landkreis eingereicht. Das Projekt erhielt eine Förderung von 34.000 Euro, ein zusätzlicher Betrag von etwa 3.700 Euro wurde von der Stadt Schnackenburg beigesteuert. Durch das Engagement vieler ehrenamtlicher Helfer wurde das Projekt umgesetzt.

    ![](https://schnackenburg.de/wp-content/uploads/Fitnesspark-1-scaled-e1737820101672.jpg)

    ![](https://schnackenburg.de/wp-content/uploads/Fitnesspark-15.jpg)

    #### FeierlicheEröffnung auf der Sportiven Landpartie

    Der Fitnesspark wurde am 4. August 2024 im Rahmen der 25. Sportiven Landpartie feierlich eröffnet. Eine Holzsitzbank als Erholungsplatz für die Nutzer des Fitnessparks wurde von den Gartower Landfrauen gespendet. Der Fitnesspark richtet sich an alle Sportbegeisterten und ergänzt ideal das bestehende Sportprogramm des Turn- und Sportvereins Schnackenburg.

