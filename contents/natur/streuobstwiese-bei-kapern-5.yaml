title: Streuobstwiese bei Kapern
authors:
  - bernd-quast
published: 2023-02-13
text:
  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Hintergrund

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

