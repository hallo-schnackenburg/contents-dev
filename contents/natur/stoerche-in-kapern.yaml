    ## Wer dabei ist

    Anmeldungen sind bis eine Woche vorher möglich. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
  summary: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Anmeldungen sind bis eine Woche vorher möglich.
