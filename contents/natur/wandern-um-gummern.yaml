text:
  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Hintergrund

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich.

