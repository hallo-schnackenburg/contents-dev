text:
  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Wer dabei ist

    Anmeldungen sind bis eine Woche vorher möglich. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
