text:
  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.

    ## Was zu tun ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Anmeldungen sind bis eine Woche vorher möglich.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
