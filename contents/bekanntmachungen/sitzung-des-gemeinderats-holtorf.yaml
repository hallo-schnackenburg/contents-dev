title: Sitzung des Gemeinderats Holtorf
text:
  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.

    ## Wer dabei ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

