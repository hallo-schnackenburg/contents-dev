    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Zur Geschichte

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
