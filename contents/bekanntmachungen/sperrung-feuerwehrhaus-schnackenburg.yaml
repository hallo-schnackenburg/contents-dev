    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Was zu tun ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
