text:
  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Anmeldungen sind bis eine Woche vorher möglich.

    ## Wer dabei ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
