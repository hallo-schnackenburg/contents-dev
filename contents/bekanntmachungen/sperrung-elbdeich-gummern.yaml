  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Zur Geschichte

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
