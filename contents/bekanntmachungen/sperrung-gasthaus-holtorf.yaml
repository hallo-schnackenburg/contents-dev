    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Hintergrund

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Anmeldungen sind bis eine Woche vorher möglich.

    Anmeldungen sind bis eine Woche vorher möglich.
