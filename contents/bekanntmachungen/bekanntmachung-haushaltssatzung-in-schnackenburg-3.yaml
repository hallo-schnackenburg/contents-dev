text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Was zu tun ist

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich.
