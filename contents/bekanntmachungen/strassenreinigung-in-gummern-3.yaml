text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Wer dabei ist

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Anmeldungen sind bis eine Woche vorher möglich.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
  summary: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
