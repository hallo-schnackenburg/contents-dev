    ## Zur Geschichte

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
  summary: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Anmeldungen sind bis eine Woche vorher möglich.
