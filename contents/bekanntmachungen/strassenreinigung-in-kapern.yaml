    ## Zur Geschichte

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Anmeldungen sind bis eine Woche vorher möglich. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
