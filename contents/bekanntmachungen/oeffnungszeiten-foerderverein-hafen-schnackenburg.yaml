    Anmeldungen sind bis eine Woche vorher möglich. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Was zu tun ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
