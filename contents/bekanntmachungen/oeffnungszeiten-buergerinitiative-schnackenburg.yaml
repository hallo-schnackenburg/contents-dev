  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Zur Geschichte

    Anmeldungen sind bis eine Woche vorher möglich. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

