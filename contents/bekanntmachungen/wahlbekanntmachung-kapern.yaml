text:
  body: |
    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    ## Was zu tun ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
