  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Hintergrund

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
