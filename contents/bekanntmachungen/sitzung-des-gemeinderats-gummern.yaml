    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
  summary: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
