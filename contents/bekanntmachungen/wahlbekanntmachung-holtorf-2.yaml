text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Was zu tun ist

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen.
