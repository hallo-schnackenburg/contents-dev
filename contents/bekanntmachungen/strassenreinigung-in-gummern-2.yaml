    ## Was zu tun ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Anmeldungen sind bis eine Woche vorher möglich.
