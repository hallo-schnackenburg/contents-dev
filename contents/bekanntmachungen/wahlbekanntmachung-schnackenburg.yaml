    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
