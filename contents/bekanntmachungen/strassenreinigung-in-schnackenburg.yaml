    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Zur Geschichte

    Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
