published: 2025-02-22
text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Zur Geschichte

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
  summary: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
