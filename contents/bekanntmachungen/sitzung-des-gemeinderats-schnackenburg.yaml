text:
  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Hintergrund

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    Anmeldungen sind bis eine Woche vorher möglich. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
