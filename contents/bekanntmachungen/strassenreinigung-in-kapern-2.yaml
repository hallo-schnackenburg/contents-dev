text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Zur Geschichte

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
