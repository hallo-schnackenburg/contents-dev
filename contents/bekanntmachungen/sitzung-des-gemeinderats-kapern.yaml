text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Wer dabei ist

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

