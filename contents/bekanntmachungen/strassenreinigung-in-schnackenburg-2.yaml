    ## Was zu tun ist

    Anmeldungen sind bis eine Woche vorher möglich. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen.
