    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Was zu tun ist

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
