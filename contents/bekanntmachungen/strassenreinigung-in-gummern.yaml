  summary: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.
