    ## Wer dabei ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
