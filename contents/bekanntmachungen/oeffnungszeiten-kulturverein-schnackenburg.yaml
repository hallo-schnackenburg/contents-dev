    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Zur Geschichte

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

