    ## Hintergrund

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Anmeldungen sind bis eine Woche vorher möglich.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
