text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Was zu tun ist

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
