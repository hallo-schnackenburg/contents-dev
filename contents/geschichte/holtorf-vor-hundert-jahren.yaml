    ## Zur Geschichte

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
