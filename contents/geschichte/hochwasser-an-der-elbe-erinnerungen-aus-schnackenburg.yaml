text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    ## Wer dabei ist

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Anmeldungen sind bis eine Woche vorher möglich.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
