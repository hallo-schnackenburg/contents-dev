text:
  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Hintergrund

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
  summary: |
