  body: |
    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Hintergrund

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
