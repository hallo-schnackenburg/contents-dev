    ## Hintergrund

    Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
  summary: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
