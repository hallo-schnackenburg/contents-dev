text:
  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Hintergrund

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
