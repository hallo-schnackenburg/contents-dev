    ## Zur Geschichte

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Anmeldungen sind bis eine Woche vorher möglich.

