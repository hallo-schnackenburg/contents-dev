    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Was zu tun ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
