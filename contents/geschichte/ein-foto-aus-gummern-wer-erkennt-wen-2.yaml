  body: |
    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Zur Geschichte

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Anmeldungen sind bis eine Woche vorher möglich. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
