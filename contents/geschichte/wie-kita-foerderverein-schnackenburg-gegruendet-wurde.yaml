    ## Zur Geschichte

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

