title: Wo stand die Burg von Schnackenburg?
published: 2026-09-06
text:
  body: |
    ## BLOG

    *Stephan Prieß,* *06.09.2026*

    #### Wer heute durch Schnackenburg spaziert, sucht vergebens nach Mauern, Wällen oder Türmen. Von der Burg, die dem Ort seinen Namen gab, ist nichts mehr zu sehen. Und doch lässt sich ihr genauer Standort erstaunlich präzise rekonstruieren – zwei historische Karten aus dem Niedersächsischen Landesarchiv verraten ihn: am Aland, kurz vor dessen Mündung in die Elbe.

    ![So könnte die erste slawische Ringwallburg am Aland ausgesehen haben (Mit KI generiert)](https://schnackenburg.de/wp-content/uploads/2026/09/Burg_001-2.jpg)

    #### Eine Burg am Aland

    Diese Lage war im Mittelalter keine Nebensache, sondern der eigentliche Grund für die Bedeutung des Ortes: Wer hier saß, konnte die Schifffahrt auf der Elbe und dem Aland kontrollieren und Zölle erheben. Schon 1315 ist ein Elbzoll in Schnackenburg urkundlich belegt.

    Die Burg selbst reicht wohl noch weiter zurück. Erstmals indirekt erwähnt wird sie 1218/1219. Zu diesem Zeitpunkt hatte das gleichnamige Adelsgeschlecht seinen Stammsitz allerdings bereits nach Mecklenburg verlegt.

    Vieles spricht dafür, dass es sich ursprünglich um eine slawische Ringwallburg aus dem 11. Jahrhundert handelte, wie sie in der Region mehrfach vorkam: umflossen vom Aland und über die Jahrhunderte zu einer größeren Anlage ausgebaut.

    #### Die Ritter von Schnackenburg

    Mit dem Ort ist ein Adelsgeschlecht verbunden, das seinen Namen trug: die Ritter von Schnackenburg, in den Quellen auch als Schnakenburg, Snakenburg oder Snakenburch überliefert. Der Name geht vermutlich auf „Snaca“ zurück, das altniederdeutsche Wort für Schlange. Passend zeigte das Familienwappen einen Schrägbalken, belegt mit einer Schlange.

    Der erste greifbare Vertreter der Familie ist Johannes von Schnakenburg, der 1218 als Zeuge in einer Urkunde des Klosters Doberan auftritt und später im Dienst der Fürsten von Rostock und Werle stand. Seine Nachkommen lassen sich bis ins 14. Jahrhundert in mecklenburgischen Quellen nachweisen. Ein Zweig der Familie zog es sogar bis nach Schweden: Um 1360 wanderte eine Linie dorthin aus und stieg unter dem Namen Snakenborg in den schwedischen Adel auf, erlosch aber bereits im späten 15. Jahrhundert.

    Die Familie hatte die Burg an der Elbe also längst verlassen, als deren wechselvolle Geschichte im 14. Jahrhundert erst richtig Fahrt aufnahm.

    ![Wappen des Rittergeschlechts von Schnackenburg](https://schnackenburg.de/wp-content/uploads/2026/09/Burg_003.jpg)

    ![Kaiser Karl IV. (Quelle: Mittelalter Wiki, CC-BY-SA)](https://schnackenburg.de/wp-content/uploads/2026/09/Burg_003-3.jpg)

    #### Zankapfel zwischen Fürsten

    Schnackenburg war wegen seiner Zolleinnahmen begehrt. Ort und Burg wechselten mehrfach zwischen den Herzögen von Braunschweig-Lüneburg und den Markgrafen von Brandenburg. Ab 1373 gehörte Schnackenburg zur Altmark und damit zum Besitz Kaiser Karls IV., der sich 1377 sogar persönlich in der Stadt aufhielt, um die Zolleinnahmen zu prüfen. Lange währte der Frieden nicht: 1390/91 wurde die Burg im Grenzstreit zwischen Lüneburg und Brandenburg belagert und von den Lüneburgern erobert.

    1410 erhielt der Ritter von Zachen die Burg von Herzog Heinrich von Lüneburg als Lehen auf Lebenszeit. Spätestens zu dieser Zeit muss die Anlage erweitert worden sein, denn die Quellen sprechen nun vom „Schloss Schnackenburg“. Eine Urkunde von 1446 verortet einen Platz „auf dem Aland beim Schloss Schnackenburg“ und belegt damit, dass die Burg direkt am Fluss lag. 1555 verkaufte Georg von Maltzahn das Schloss samt Stadt und Zoll an Andreas von Bülow – danach verstummen die urkundlichen Spuren fast vollständig.

    #### Zwei Karten als Schlüssel

    Weil von der Burg selbst nichts erhalten ist, muss ihr genauer Standort aus historischem Kartenmaterial erschlossen werden. Zwei Karten im Niedersächsischen Landesarchiv spielen dabei die zentrale Rolle: [Eine wurde 1695 von Rallen im Maßstab 1:8.000 gezeichnet](https://www.arcinsys.niedersachsen.de/arcinsys/showArchivalDescriptionDetails?archivalDescriptionId=4543441) und zeigt einen Burgwall im Bereich um Schnackenburg. [Die andere entstand kurze Zeit später Anfang des 18. Jahrhunderts durch G. D. Michaelsen im Maßstab 1:5.700](https://www.arcinsys.niedersachsen.de/arcinsys/showArchivalDescriptionDetails?archivalDescriptionId=4543002) und dokumentiert die Landesgrenze zwischen Schnackenburg, Kapern und Bömenzien – auch sie verzeichnet denselben Burgwall.
    Dass zwei unabhängig voneinander entstandene Karten übereinstimmend auf denselben Ort verweisen, ist ein starkes Indiz. Zusammen mit der Urkunde von 1446 ergibt sich ein stimmiges Bild: Die Burg stand am Aland, nahe seiner Mündung in die Elbe.

    ![Karte Anfang des 18. Jahrhunderts mit eingezeichnetem Burgwall (Quelle: Niedersächsisches Landesarchiv, CC-BY-NC-SA)](https://schnackenburg.de/wp-content/uploads/2026/09/Burg_004.jpg)

    ![Kupferstich von Schnackenburg 1654 (Quelle: Matthäus Merian, Topographia Germaniae, Braunschweig-Lüneburg)](https://schnackenburg.de/wp-content/uploads/2026/09/Burg_003-1.jpg)

    #### Wie die Burg verschwand

    Wann genau die Burg unterging, lässt sich nicht mit letzter Sicherheit sagen. Vermutlich fiel sie im Dreißigjährigen Krieg (1618–1648) einer Zerstörung zum Opfer, ein eindeutiger urkundlicher Beleg dafür fehlt jedoch. Sicher ist dagegen, dass der Burgwall als sichtbare Erhebung noch danach existierte, bis 1728 die gesamte Stadt Schnackenburg einer verheerenden Feuersbrunst zum Opfer fiel. Um die Brandruinen zu beseitigen, trug man den Burgwall vollständig ab und nutzte das Erdmaterial, um die Ruinen zu überdecken. Mit diesem Wiederaufbau verschwanden auch die letzten sichtbaren Reste der einstigen Burganlage für immer.

    #### Was bleibt

    Geblieben sind der Name des Ortes und eine Lage, die sich bis heute aus alten Karten und Urkunden rekonstruieren lässt. Von der Burg, die einst über Jahrhunderte um Zoll und Macht umkämpft war und deren Rittergeschlecht bis nach Mecklenburg und Schweden verzweigte, erzählt heute nur noch die Geschichte selbst.

    ***Wo genau der Burgwall lag, könnt ihr im [Virtuellen Stadtrundgang](https://schnackenburg.de/virtueller-stadtrundgang/) mit der Future History App erkunden.***
