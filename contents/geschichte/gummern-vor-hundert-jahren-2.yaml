    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Hintergrund

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
