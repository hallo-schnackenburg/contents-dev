text:
  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Was zu tun ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
