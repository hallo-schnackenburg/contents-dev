text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Was zu tun ist

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
  summary: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
