  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Anmeldungen sind bis eine Woche vorher möglich.

    ## Wer dabei ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
