  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Was zu tun ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
  summary: |
    Anmeldungen sind bis eine Woche vorher möglich. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
