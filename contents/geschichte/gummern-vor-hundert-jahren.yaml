    ## Wer dabei ist

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
