    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Hintergrund

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
