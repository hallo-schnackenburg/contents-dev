text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    ## Was zu tun ist

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Anmeldungen sind bis eine Woche vorher möglich.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
  summary: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
