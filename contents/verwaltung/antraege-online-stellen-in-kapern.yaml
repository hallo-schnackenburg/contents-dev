title: Anträge online stellen in Kapern
authors:
  - lars-pannier
text:
  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Was zu tun ist

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
