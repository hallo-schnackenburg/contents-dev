title: Bauvorhaben in Kapern
authors:
  - bernd-kaehlert
text:
  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Zur Geschichte

    Anmeldungen sind bis eine Woche vorher möglich. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
