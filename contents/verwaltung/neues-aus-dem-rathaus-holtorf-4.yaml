  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
