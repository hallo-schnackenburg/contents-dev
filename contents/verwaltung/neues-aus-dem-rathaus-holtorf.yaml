  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Wer dabei ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
  summary: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
