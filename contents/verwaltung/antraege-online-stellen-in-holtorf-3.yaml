    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
