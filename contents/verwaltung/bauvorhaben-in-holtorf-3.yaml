text:
  body: |
    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Zur Geschichte

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    Anmeldungen sind bis eine Woche vorher möglich.
