text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Was zu tun ist

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

