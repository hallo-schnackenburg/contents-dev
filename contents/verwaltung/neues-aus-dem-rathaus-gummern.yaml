text:
  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Anmeldungen sind bis eine Woche vorher möglich.

    ## Wer dabei ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

