    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
