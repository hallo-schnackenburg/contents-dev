  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Zur Geschichte

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Anmeldungen sind bis eine Woche vorher möglich.

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
