text:
  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    ## Was zu tun ist

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
