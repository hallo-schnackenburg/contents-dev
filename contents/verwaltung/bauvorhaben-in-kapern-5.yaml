text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Wer dabei ist

    Anmeldungen sind bis eine Woche vorher möglich. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
