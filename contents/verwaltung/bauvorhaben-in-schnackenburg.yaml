text:
  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Hintergrund

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
