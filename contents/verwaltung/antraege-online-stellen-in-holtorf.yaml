  body: |
    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Hintergrund

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Anmeldungen sind bis eine Woche vorher möglich.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
