  summary: |
    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
