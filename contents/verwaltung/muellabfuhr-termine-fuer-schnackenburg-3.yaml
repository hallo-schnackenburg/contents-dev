text:
  body: |
    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    ## Wer dabei ist

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.
