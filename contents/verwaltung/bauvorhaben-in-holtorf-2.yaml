  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    ## Zur Geschichte

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Anmeldungen sind bis eine Woche vorher möglich. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Kosten trägt die Gemeinde, Spenden sind willkommen.
