    ## Wer dabei ist

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Der Termin wird rechtzeitig im Aushang bekanntgegeben.
