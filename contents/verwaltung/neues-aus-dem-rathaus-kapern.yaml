  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Wer dabei ist

    Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
