    ## Hintergrund

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.
