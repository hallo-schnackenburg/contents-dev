    ## Zur Geschichte

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
