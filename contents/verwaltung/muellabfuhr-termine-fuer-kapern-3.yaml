    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    ## Hintergrund

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Anmeldungen sind bis eine Woche vorher möglich. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
