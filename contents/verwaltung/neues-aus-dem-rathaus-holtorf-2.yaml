title: Neues aus dem Rathaus Holtorf
published: 2022-07-15
text:
  body: |
    Anmeldungen sind bis eine Woche vorher möglich. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    ## Hintergrund

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt.

    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.
