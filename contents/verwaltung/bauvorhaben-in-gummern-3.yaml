    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Hintergrund

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

