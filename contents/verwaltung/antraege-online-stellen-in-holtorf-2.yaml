  body: |
    Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Wer dabei ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Anmeldungen sind bis eine Woche vorher möglich. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
