  body: |
    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    ## Wer dabei ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort. Anmeldungen sind bis eine Woche vorher möglich.

    Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
  summary: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
