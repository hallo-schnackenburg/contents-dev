    Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Wer dabei ist

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

