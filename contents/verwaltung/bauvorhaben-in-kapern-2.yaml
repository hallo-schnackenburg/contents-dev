  body: |
    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.

    ## Wer dabei ist

    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung.

