    Der Termin wird rechtzeitig im Aushang bekanntgegeben. Anmeldungen sind bis eine Woche vorher möglich.

    ## Hintergrund

    Anmeldungen sind bis eine Woche vorher möglich. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.

    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.
