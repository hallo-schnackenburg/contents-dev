text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.

    ## Wer dabei ist

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.

    Die Kosten trägt die Gemeinde, Spenden sind willkommen. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt.
  summary: |
    Anmeldungen sind bis eine Woche vorher möglich. Die Gemeinde bittet alle Bürgerinnen und Bürger um Beachtung. Schon vor Jahrzehnten gehörte dies zum Leben im Ort.
