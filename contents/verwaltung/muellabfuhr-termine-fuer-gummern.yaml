  body: |
    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Der Termin wird rechtzeitig im Aushang bekanntgegeben.

    ## Hintergrund

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    Der Weg führt am Deich entlang und ist auch mit dem Fahrrad gut zu befahren.
