title: "Müllabfuhr: Termine für Schnackenburg"
published: 2024-07-14
text:
  body: |
    Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten. Die Kosten trägt die Gemeinde, Spenden sind willkommen.

    ## Zur Geschichte

    Viele Helferinnen und Helfer haben in den vergangenen Wochen mit angepackt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Wer Fotos oder Geschichten beisteuern möchte, meldet sich bitte beim Heimatverein.
