    Anmeldungen sind bis eine Woche vorher möglich. Die Elbe prägt den Ort seit jeher, im Guten wie im Schlechten.

    ## Zur Geschichte

    Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig. Die Kosten trägt die Gemeinde, Spenden sind willkommen. Der Termin wird rechtzeitig im Aushang bekanntgegeben. Weitere Informationen gibt es im Rathaus oder bei den Ansprechpersonen vor Ort.

    Die Veranstaltung findet bei jedem Wetter statt, für Getränke und Speisen ist gesorgt. Im Sommer ist hier besonders viel los, im Winter bleibt es ruhig.
